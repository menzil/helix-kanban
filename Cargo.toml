[package]
name = "helix-kanban"
version = "0.3.6"
edition = "2024"
rust-version = "1.88"
authors = ["Ruzaji Yasin <menzil@live.cn>"]
description = "A terminal-based kanban board with file-based storage, multi-project support, Helix-style keybindings, and built-in MCP server for AI integration"
readme = "README.md"
homepage = "https://github.com/menzil/helix-kanban"
repository = "https://github.com/menzil/helix-kanban"
license = "MIT OR Apache-2.0"
keywords = ["kanban", "todo", "tui", "terminal", "productivity"]
categories = ["command-line-utilities"]
exclude = [
    ".kanban/",
    "*.md",
    "!README.md",
    "!CHANGELOG.md",
    "*.pdf",
    "*.sh",
    "*.bak",
    "src/ui/board.rs",
]

[[bin]]
name = "hxk"
path = "src/main.rs"

[features]
default = ["clipboard"]
clipboard = ["arboard"]

[dependencies]
# TUI framework
ratatui = "0.30.2"
crossterm = "0.29.0"
ratatui-textarea = "0.9.2"  # Text editor widget with Helix-style keybindings

# Data serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

# Utilities
chrono = "0.4.45"
anyhow = "1.0.104"
nucleo-matcher = "0.3.1"
arboard = { version = "3.6.1", default-features = false, optional = true }  # Clipboard support (text only)

[dev-dependencies]
tempfile = "3.27.0"
